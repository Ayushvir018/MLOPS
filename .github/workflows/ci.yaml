
# GitHub Actions workflow
# GitHub automatically looks for workflows inside .github/workflows/

name: Iris ML API - CI Pipeline

# Define when GitHub should run the workflow
on:
  # Run CI whenever code is pushed to main
  push:
    branches:
      - main

  # Validate pull requests targeting main
  pull_request:
    branches:
      - main

# Permissions
permissions:
  contents: read

# Define jobs that make up the pipeline
jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu VM
    runs-on: ubuntu-latest

    # Define the sequence of steps
    steps:
      # Step 1: Download repository content
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Install Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      # Step 4: Execute automated tests
      - name: Run tests
        run: python -m pytest -v

      # Step 5: Build Docker image only after tests pass
      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{ github.sha }} .
